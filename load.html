<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{margin:0;padding:0}
  body,html,#g{width:100%;height:100%;background:#000;overflow:hidden;color:#fff;font-family:sans-serif}
  #err{display:flex;justify-content:center;align-items:center;height:100%}
</style>
</head>
<body>
<div id="g"></div>
<script>
const p=new URLSearchParams(location.search), r=p.get('rom'), c=p.get('core');
const ARC='arcade.7z', PS1='psx.7z';
const B={fbneo:ARC, mame2003:ARC, psx:PS1};

if(r && c){
  EJS_player = '#g';
  EJS_core = c;
  EJS_gameUrl = r;
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  EJS_startOnLoaded = true;
  if(B[c]) EJS_biosUrl = B[c];

  const s = document.createElement('script');
  s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
  document.body.appendChild(s);
} else {
  document.getElementById('g').innerHTML = '<div id="err"><p>Thiếu tham số <b>core</b> hoặc <b>rom</b> trên URL!</p></div>';
}
</script>
</body>
</html>
