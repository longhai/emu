<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#g{width:100%;height:100%;background:#000;overflow:hidden;color:#fff;font-family:sans-serif}
#err{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;gap:10px;text-align:center}
</style>
</head>

<body>
<div id="g"></div>

<script>
const p=new URLSearchParams(location.search),
      r=p.get('rom'),
      c=p.get('core'),
      B={fbneo:'arcade.7z',mame2003:'arcade.7z',psx:'psx.7z'};

if(r&&c){
  EJS_player='#g';
  EJS_core=c;
  EJS_gameUrl=r;
  EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  EJS_startOnLoaded=true;

  if(B[c]) EJS_biosUrl=B[c];

  const s=document.createElement('script');
  s.src=EJS_pathtodata+'loader.js';
  document.body.appendChild(s);
}else{
  g.innerHTML=
    '<div id="err">'+
    '<p>Thiếu tham số <b>core</b> hoặc <b>rom</b> trên URL!</p>'+
    '<p>load.html?core=fbneo&rom=https://...game.zip</p>'+
    '</div>';
}
</script>
</body>
</html>
