<style>
*{margin:0}html,body,#g{width:100%;height:100%;background:#000;color:#fff;overflow:hidden}
#g{display:grid;place-content:center;text-align:center;gap:10px}
</style>
<div id=g></div>
<script>
S = new URLSearchParams(location.search);
C = S.get('core'); R = S.get('rom');

if (R && C) {
  EJS_player = '#g';
  EJS_core = C;
  EJS_gameUrl = R;
  EJS_gameParentUrl = S.get('p');     // Link ROM mẹ cho game thùng (.zip)
  EJS_gamePatchUrl = S.get('patch');  // Link file Mod/Việt hóa (.ips/.bps)
  EJS_startOnLoaded = true;
  EJS_biosUrl = {fbneo:'arcade.7z', mame2003:'arcade.7z', psx:'psx.7z'}[C];
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  
  s = document.createElement('script');
  s.src = EJS_pathtodata + 'loader.js';
  document.head.append(s);
} else {
  g.innerHTML = '<p>Thiếu tham số <b>core</b> hoặc <b>rom</b>!</p><p>load.html?core=fbneo&rom=https://...game.zip</p>';
}
</script>
